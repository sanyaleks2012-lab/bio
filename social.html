<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social - Panorama</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-glow"></div>
  <canvas id="bg-canvas"></canvas>

  <main class="card panorama-panel">
    <h2 class="section-title">COMMUNICATION CHANNELS</h2>
    <div class="panorama-divider"></div>

    <div class="social-container">
      <a href="https://github.com/sanyaleks2012-lab" class="social-link" target="_blank" rel="noopener noreferrer">
        <div class="social-icon-wrapper">
          <img src="github.png" alt="GitHub" class="social-icon">
        </div>
        <div class="social-info">
          <span class="social-text">GitHub</span>
          <span class="social-sub">sanyaleks2012-lab</span>
        </div>
      </a>

      <a href="https://discord.com/users/1286678957940412467" class="social-link" target="_blank" rel="noopener noreferrer">
        <div class="social-icon-wrapper">
          <img src="discord.png" alt="Discord" class="social-icon">
        </div>
        <div class="social-info">
          <span class="social-text">Discord</span>
          <span class="social-sub">qqqcerg</span>
        </div>
      <a>
    </div>

      <a href="https://steamcommunity.com/id/TetoOfVibe/" class="social-link" target="_blank" rel="noopener noreferrer">
        <div class="social-icon-wrapper">
          <img src="steam.png" alt="Steam" class="social-icon">
        </div>
        <div class="social-info">
          <span class="social-text">Steam</span>
          <span class="social-sub">TetoOfVibe</span>
        </div>
      </a>
    </div>

    <nav class="nav-buttons" style="margin-top: 2rem;">
      <a href="index.html" class="btn btn-panorama">Back</a>
    </nav>
  </main>

  <script src="main.js" defer></script>
</body>
</html>
